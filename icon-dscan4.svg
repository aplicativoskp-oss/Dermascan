<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a3"/>
      <stop offset="50%" stop-color="#c9a96e"/>
      <stop offset="100%" stop-color="#a07840"/>
    </linearGradient>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Outer rings -->
  <circle cx="256" cy="256" r="238" fill="none" stroke="#c9a96e" stroke-width="0.8" opacity="0.25"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#c9a96e" stroke-width="0.4" opacity="0.12"/>

  <!-- Top star ornament -->
  <g filter="url(#softglow)">
    <path d="M256 60 L259 70 L270 70 L262 77 L265 87 L256 81 L247 87 L250 77 L242 70 L253 70 Z" fill="#c9a96e" opacity="0.75"/>
  </g>

  <!-- Top decorative line -->
  <line x1="176" y1="100" x2="336" y2="100" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
  <line x1="206" y1="108" x2="306" y2="108" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>

  <!-- DScan main text -->
  <text x="256" y="290"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="86"
    font-weight="300"
    letter-spacing="8"
    fill="url(#goldGrad)"
    filter="url(#softglow)">DScan</text>

  <!-- Divider line -->
  <line x1="146" y1="316" x2="366" y2="316" stroke="#c9a96e" stroke-width="0.8" opacity="0.4"/>

  <!-- Harmony text -->
  <text x="256" y="356"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="28"
    font-weight="300"
    letter-spacing="12"
    fill="#c9a96e"
    opacity="0.55">Harmony</text>

  <!-- Bottom decorative lines -->
  <line x1="176" y1="390" x2="336" y2="390" stroke="#c9a96e" stroke-width="0.8" opacity="0.3"/>
  <line x1="206" y1="398" x2="306" y2="398" stroke="#c9a96e" stroke-width="0.5" opacity="0.2"/>

  <!-- Bottom star ornament -->
  <g filter="url(#softglow)">
    <path d="M256 430 L258 437 L265 437 L260 441 L262 448 L256 444 L250 448 L252 441 L247 437 L254 437 Z" fill="#c9a96e" opacity="0.5"/>
  </g>

  <!-- Bottom dots -->
  <g fill="#c9a96e" opacity="0.35">
    <circle cx="256" cy="470" r="2.5"/>
    <circle cx="244" cy="466" r="1.2"/>
    <circle cx="268" cy="466" r="1.2"/>
  </g>

</svg>
