<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DermaScan AI · Análise Cosmética Visual</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;200;300;400&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0a09;--surface:#121110;--surface2:#1a1814;
  --border:#2a2420;--border2:#353028;
  --gold:#c9a96e;--gold2:#e8d5a3;
  --gold-dim:rgba(201,169,110,.12);--gold-dim2:rgba(201,169,110,.22);
  --text:#e8e0d5;--text2:#a89880;--text3:#6a6058;
  --red:#e8a0a0;--red-dim:rgba(232,160,160,.12);--green:#8fc98f;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Josefin Sans',sans-serif;-webkit-text-size-adjust:100%;}
.app{min-height:100vh;max-width:540px;margin:0 auto;padding-bottom:60px;position:relative;}
.app::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");}
.content{position:relative;z-index:1;}
.header{text-align:center;padding:36px 20px 24px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:1px;background:var(--gold);}
.logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:10px;color:var(--gold);text-transform:uppercase;}
.logo-star{color:var(--gold2);margin-right:6px;}
.logo-sub{font-size:9px;letter-spacing:5px;color:var(--text3);text-transform:uppercase;margin-top:6px;font-weight:200;}
.upload-section{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;}
.preview-frame{width:100%;max-width:360px;height:300px;border:1px solid var(--border2);border-radius:4px;background:var(--surface);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .3s;flex-shrink:0;}
.preview-frame.has-image{border-color:var(--gold);}
.preview-frame::before,.preview-frame::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--gold);border-style:solid;pointer-events:none;opacity:0;transition:opacity .3s;}
.preview-frame.has-image::before{opacity:1;top:8px;left:8px;border-width:1px 0 0 1px;}
.preview-frame.has-image::after{opacity:1;bottom:8px;right:8px;border-width:0 1px 1px 0;}
.preview-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.preview-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;}
.preview-icon{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--border2);line-height:1;}
.preview-label{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;text-align:center;line-height:1.8;}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:360px;}
.file-label{flex:1;min-width:130px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);color:var(--gold);border:1px solid var(--border2);border-radius:2px;padding:14px 16px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:all .2s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.file-label:active{border-color:var(--gold);background:var(--gold-dim);}
.btn-cam{flex:1;min-width:130px;min-height:52px;background:var(--surface2);color:var(--gold);border:1px solid var(--border2);border-radius:2px;padding:14px 16px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.btn-cam:active{border-color:var(--gold);background:var(--gold-dim);}
.btn-primary{width:100%;max-width:360px;min-height:52px;background:var(--gold);color:var(--bg);border:none;border-radius:2px;padding:16px;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;font-weight:400;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.btn-primary:active:not(:disabled){background:var(--gold2);}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.notice{max-width:360px;width:100%;font-size:11px;color:var(--text3);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:2px;padding:12px 16px;letter-spacing:.5px;}
.consent-row{max-width:360px;width:100%;display:flex;align-items:flex-start;gap:10px;font-size:11px;color:var(--text2);line-height:1.7;cursor:pointer;}
.consent-row input{margin-top:3px;accent-color:var(--gold);flex-shrink:0;width:16px;height:16px;}
.error-msg{color:var(--red);font-size:11px;letter-spacing:1px;text-align:center;padding:0 4px;max-width:360px;width:100%;}
.loader-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:60px 20px;}
.loader-ring{width:40px;height:40px;border:1px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loader-text{font-size:9px;letter-spacing:5px;color:var(--text3);text-transform:uppercase;}
.cam-overlay{position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px;-webkit-overflow-scrolling:touch;}
.cam-video{width:100%;max-width:480px;border-radius:4px;border:1px solid var(--border2);background:#000;transform:scaleX(-1);}
.cam-hint{font-size:10px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;}
.cam-actions{display:flex;gap:16px;align-items:center;}
.cam-snap{width:64px;height:64px;border-radius:50%;border:none;background:var(--gold);color:var(--bg);font-size:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.cam-snap:active{transform:scale(.92);}
.cam-snap:disabled{opacity:.4;}
.cam-close{background:var(--surface);color:var(--text2);border:1px solid var(--border2);border-radius:2px;padding:12px 20px;cursor:pointer;min-height:48px;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.cam-error{color:var(--red);font-size:12px;text-align:center;max-width:340px;line-height:1.7;padding:16px;}
.report{padding:0 20px 20px;animation:fadeUp .5s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.report-header{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--border2);border-radius:4px;padding:16px;margin-bottom:16px;}
.report-thumb{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--gold-dim2);flex-shrink:0;}
.report-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--gold);letter-spacing:2px;margin-bottom:8px;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.tag{padding:3px 10px;border-radius:2px;font-size:9px;letter-spacing:2px;text-transform:uppercase;background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-dim2);}
.tag.danger{background:var(--red-dim);color:var(--red);border-color:rgba(232,160,160,.2);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:18px;margin-bottom:12px;}
.card-title{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.card-title span{color:var(--text3);}
.step-list{display:flex;flex-direction:column;gap:8px;}
.step-item{display:flex;gap:10px;align-items:flex-start;}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--gold-dim);color:var(--gold);font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:12px;color:var(--text2);line-height:1.6;letter-spacing:.3px;}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.sk-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.row-item{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--border);}
.row-item:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none;}
.row-label{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.row-val{font-size:12px;color:var(--text2);line-height:1.6;}
.conf-bar{display:flex;align-items:center;gap:8px;margin-top:8px;}
.conf-track{flex:1;height:2px;background:var(--border2);border-radius:1px;}
.conf-fill{height:2px;border-radius:1px;transition:width .6s ease;}
.conf-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;min-width:40px;text-align:right;}
.makeup-prose{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;font-weight:300;color:var(--text2);line-height:1.8;background:var(--surface2);border:1px solid var(--border2);border-radius:2px;padding:14px;}
.disclaimer-block{font-size:10px;color:var(--text3);line-height:1.8;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.reset-btn{width:100%;background:transparent;color:var(--text3);border:1px solid var(--border);border-radius:2px;padding:16px;cursor:pointer;margin-top:16px;font-family:'Josefin Sans',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;transition:all .2s;min-height:52px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.reset-btn:active{color:var(--gold);border-color:var(--gold);}
.footer{text-align:center;padding:20px;font-size:9px;letter-spacing:2px;color:var(--text3);border-top:1px solid var(--border);}
@media(max-width:480px){.sk-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback, useEffect } = React;

const ANALYSIS_PROMPT = `Voce e um assistente de analise cosmetica visual informativa.
Analise apenas caracteristicas visuais aparentes de um rosto em foto.
NAO faca diagnostico medico. NAO prescreva tratamento medico.
NAO recomende suplementacao. NAO recomende procedimentos invasivos.
NAO afirme certezas quando a imagem nao permitir.

Responda APENAS com JSON valido, sem markdown e sem texto extra.

Schema obrigatorio:
{
  "perfil": {
    "tipoPeleEstimado": "string",
    "formatoRostoEstimado": "string",
    "subtomEstimado": "string",
    "confiancaGeral": "baixa|media|alta"
  },
  "observacoes": ["string"],
  "skincare": {
    "manha": ["string","string","string","string"],
    "noite": ["string","string","string","string"]
  },
  "visagismo": {
    "cortes": ["string","string"],
    "coloracao": ["string","string","string"],
    "sobrancelha": { "estilo": "string", "dica": "string" }
  },
  "colorimetria": {
    "cartelaProvavel": "string",
    "coresPoder": ["string","string","string","string"],
    "coresEvitar": ["string","string"]
  },
  "maquiagem": {
    "batom": ["string","string","string"],
    "sombra": ["string","string"],
    "blush": "string"
  },
  "limitacoes": ["string"],
  "disclaimer": "Analise visual informativa. Nao substitui avaliacao dermatologica ou medica."
}`;

async function analyzeWithClaude(base64Image) {
  async function analyzeWithClaude(base64Image) {
  const response = await fetch("/.netlify/functions/analyze", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image: base64Image })
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Falha na analise.");
  return data;
}
      model: "claude-sonnet-4-20250514",
      max_tokens: 1400,
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Image } },
          { type: "text", text: ANALYSIS_PROMPT }
        ]
      }]
    })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || "Falha na analise. Tente novamente.");
  }
  const data = await response.json();
  const raw = (data.content || []).map(i => i.text || "").join("");
  const clean = raw.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();
  return JSON.parse(clean);
}

function resizeToBase64(file, maxDim = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("Nao foi possivel carregar a imagem.")); };
    img.src = objectUrl;
  });
}

function hasCameraSupport() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
}

const CONF_COLOR = { baixa:"#e8a87c", media:"#c9a96e", alta:"#8fc98f" };
const CONF_LABEL = { baixa:"Baixa", media:"Media", alta:"Alta" };
const CONF_PCT   = { baixa:30, media:65, alta:92 };

function ConfBar({ level }) {
  const color = CONF_COLOR[level] || CONF_COLOR.media;
  return (
    <div className="conf-bar">
      <div className="conf-track">
        <div className="conf-fill" style={{ width:`${CONF_PCT[level]||65}%`, background:color }} />
      </div>
      <span className="conf-lbl" style={{ color }}>{CONF_LABEL[level]||"Media"}</span>
    </div>
  );
}

function StepList({ items=[] }) {
  return (
    <div className="step-list">
      {items.map((t,i)=>(
        <div className="step-item" key={i}>
          <div className="step-num">{i+1}</div>
          <div className="step-text">{t}</div>
        </div>
      ))}
    </div>
  );
}

function TagRow({ items=[], danger }) {
  return (
    <div className="tag-row">
      {items.map((t,i)=><span key={i} className={`tag${danger?" danger":""}`}>{t}</span>)}
    </div>
  );
}

function Report({ data, previewSrc, onReset }) {
  const p   = data?.perfil       || {};
  const sk  = data?.skincare     || {};
  const vis = data?.visagismo    || {};
  const col = data?.colorimetria || {};
  const maq = data?.maquiagem    || {};
  return (
    <div className="report">
      <div className="report-header">
        {previewSrc && <img src={previewSrc} alt="" className="report-thumb" />}
        <div style={{flex:1}}>
          <div className="report-title">Analise Visual</div>
          <div className="tag-row">
            {p.tipoPeleEstimado     && <span className="tag">{p.tipoPeleEstimado}</span>}
            {p.formatoRostoEstimado && <span className="tag">{p.formatoRostoEstimado}</span>}
            {p.subtomEstimado       && <span className="tag">{p.subtomEstimado}</span>}
          </div>
          {p.confiancaGeral && <ConfBar level={p.confiancaGeral} />}
        </div>
      </div>

      {!!data?.observacoes?.length && (
        <div className="card">
          <div className="card-title">Observacoes <span>visuais</span></div>
          <StepList items={data.observacoes} />
        </div>
      )}

      <div className="card">
        <div className="card-title">Skincare <span>protocolo</span></div>
        <div className="sk-grid">
          <div><div className="sk-label">Manha</div><StepList items={sk.manha||[]} /></div>
          <div><div className="sk-label">Noite</div><StepList items={sk.noite||[]} /></div>
        </div>
      </div>

      <div className="card">
        <div className="card-title">Visagismo <span>facial</span></div>
        <div className="row-item">
          <span className="row-label">Cortes sugeridos</span>
          <div className="row-val">{(vis.cortes||[]).join(", ")}</div>
        </div>
        <div className="row-item">
          <span className="row-label">Coloracao</span>
          <div className="row-val">{(vis.coloracao||[]).join(", ")}</div>
        </div>
        {vis.sobrancelha && (
          <div className="row-item">
            <span className="row-label">Sobrancelha</span>
            <div className="row-val">
              <strong style={{color:"var(--gold)",fontWeight:400}}>{vis.sobrancelha.estilo}</strong>
              {vis.sobrancelha.dica ? ` - ${vis.sobrancelha.dica}` : ""}
            </div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="card-title">Colorimetria <span>paleta</span></div>
        <div className="row-item">
          <span className="row-label">Cartela provavel</span>
          <div className="row-val">{col.cartelaProvavel}</div>
        </div>
        <div className="row-item">
          <span className="row-label">Cores de poder</span>
          <TagRow items={col.coresPoder||[]} />
        </div>
        <div>
          <span className="row-label">Evitar</span>
          <TagRow items={col.coresEvitar||[]} danger />
        </div>
      </div>

      <div className="card">
        <div className="card-title">Maquiagem <span>sugestoes</span></div>
        <div className="makeup-prose">
          {!!maq.batom?.length && <React.Fragment>Batons: {maq.batom.join(", ")}. </React.Fragment>}
          {!!maq.sombra?.length && <React.Fragment>Sombra: {maq.sombra.join(" ou ")}. </React.Fragment>}
          {maq.blush && <React.Fragment>Blush: {maq.blush}.</React.Fragment>}
        </div>
      </div>

      {!!data?.limitacoes?.length && (
        <div className="card">
          <div className="card-title">Limitacoes <span>da leitura</span></div>
          <StepList items={data.limitacoes} />
          {data.disclaimer && <p className="disclaimer-block">{data.disclaimer}</p>}
        </div>
      )}

      <button className="reset-btn" onClick={onReset}>Nova analise</button>
    </div>
  );
}

function CameraModal({ onCapture, onClose }) {
  const videoRef  = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const [ready, setReady]   = useState(false);
  const [camErr, setCamErr] = useState("");

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode:"user", width:{ideal:1280}, height:{ideal:1280} },
            audio: false
          });
        } catch {
          stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
        }
        if (cancelled) { stream.getTracks().forEach(t=>t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(()=>{});
        }
        setReady(true);
      } catch (e) {
        if (cancelled) return;
        const msgs = {
          NotAllowedError:      "Permissao de camera negada. Va em Configuracoes do navegador e permita o acesso a camera.",
          PermissionDeniedError:"Permissao de camera negada.",
          NotFoundError:        "Nenhuma camera encontrada neste dispositivo.",
          DevicesNotFoundError: "Nenhuma camera encontrada.",
          NotReadableError:     "A camera esta em uso por outro aplicativo. Feche-o e tente novamente.",
          TrackStartError:      "A camera esta em uso por outro aplicativo.",
          OverconstrainedError: "Camera nao suporta a configuracao solicitada.",
        };
        setCamErr(msgs[e.name] || `Camera indisponivel (${e.name||"erro desconhecido"}).`);
      }
    })();
    return () => {
      cancelled = true;
      if (streamRef.current) streamRef.current.getTracks().forEach(t=>t.stop());
    };
  }, []);

  const snap = useCallback(() => {
    const vid = videoRef.current;
    const cvs = canvasRef.current;
    if (!vid || !cvs || !ready) return;
    cvs.width  = vid.videoWidth  || 640;
    cvs.height = vid.videoHeight || 640;
    cvs.getContext("2d").drawImage(vid, 0, 0, cvs.width, cvs.height);
    cvs.toBlob(blob => {
      onCapture(new File([blob], "selfie.jpg", { type:"image/jpeg" }));
    }, "image/jpeg", 0.92);
  }, [ready, onCapture]);

  return (
    <div className="cam-overlay">
      <canvas ref={canvasRef} style={{display:"none"}} />
      {camErr ? (
        <React.Fragment>
          <div className="cam-error">{camErr}</div>
          <button className="cam-close" onClick={onClose}>Fechar</button>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <video ref={videoRef} className="cam-video" autoPlay playsInline muted />
          {!ready && <div className="cam-hint">Iniciando camera...</div>}
          <div className="cam-actions">
            <button className="cam-snap" onClick={snap} disabled={!ready}>&#128247;</button>
            <button className="cam-close" onClick={onClose}>Cancelar</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

function App() {
  const [phase, setPhase]             = useState("upload");
  const [previewSrc, setPreviewSrc]   = useState(null);
  const [currentFile, setCurrentFile] = useState(null);
  const [consent, setConsent]         = useState(false);
  const [error, setError]             = useState("");
  const [reportData, setReportData]   = useState(null);
  const [camOpen, setCamOpen]         = useState(false);

  const handleFile = useCallback((file) => {
    if (!file) return;
    if (!file.type.startsWith("image/")) { setError("Selecione uma imagem valida (JPEG, PNG, WebP...)."); return; }
    if (file.size > 15 * 1024 * 1024)   { setError("Imagem muito grande. Maximo: 15 MB."); return; }
    setError("");
    setCurrentFile(file);
    const reader = new FileReader();
    reader.onload  = (ev) => { if (ev.target && ev.target.result) setPreviewSrc(ev.target.result); };
    reader.onerror = () => setError("Nao foi possivel ler a imagem.");
    reader.readAsDataURL(file);
  }, []);

  const onFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) handleFile(file);
    e.target.value = "";
  };

  const onCamCapture = useCallback((file) => {
    setCamOpen(false);
    handleFile(file);
  }, [handleFile]);

  const analyze = async () => {
    if (!currentFile) { setError("Adicione uma foto antes de analisar."); return; }
    if (!consent)     { setError("Confirme o consentimento para continuar."); return; }
    setError("");
    setPhase("loading");
    try {
      const b64 = await resizeToBase64(currentFile);
      const result = await analyzeWithClaude(b64);
      setReportData(result);
      setPhase("report");
    } catch (e) {
      setError(e.message || "Erro na analise. Tente com uma foto mais nitida.");
      setPhase("upload");
    }
  };

  const reset = () => {
    setPhase("upload"); setPreviewSrc(null); setCurrentFile(null);
    setConsent(false); setError(""); setReportData(null);
  };

  return (
    <React.Fragment>
      {camOpen && <CameraModal onCapture={onCamCapture} onClose={() => setCamOpen(false)} />}
      <div className="app">
        <div className="content">
          <div className="header">
            <div className="logo"><span className="logo-star">&#10022;</span>DermaScan</div>
            <div className="logo-sub">Analise Cosmetica Visual · AI</div>
          </div>

          {phase === "loading" && (
            <div className="loader-wrap">
              <div className="loader-ring" />
              <div className="loader-text">Analisando</div>
            </div>
          )}

          {phase === "upload" && (
            <div className="upload-section">
              <div className={`preview-frame${previewSrc?" has-image":""}`}>
                {previewSrc
                  ? <img src={previewSrc} alt="Foto selecionada" className="preview-img" />
                  : <div className="preview-placeholder">
                      <div className="preview-icon">&#9678;</div>
                      <div className="preview-label">Foto frontal<br />boa iluminacao</div>
                    </div>
                }
              </div>

              <div className="btn-row">
                <label className="file-label" htmlFor="ds-file-input">&#8593; Galeria</label>
                <input
                  id="ds-file-input" type="file" accept="image/*" onChange={onFileChange}
                  style={{clip:"rect(0 0 0 0)",clipPath:"inset(50%)",height:1,overflow:"hidden",position:"absolute",width:1,whiteSpace:"nowrap"}}
                />
                {hasCameraSupport() && (
                  <button className="btn-cam" onClick={() => { setError(""); setCamOpen(true); }}>
                    &#9678; Camera
                  </button>
                )}
              </div>

              <div className="notice">
                Esta analise e <strong style={{fontWeight:400,color:"var(--text2)"}}>estetica e informativa</strong>.
                Nao constitui diagnostico medico nem substitui avaliacao de dermatologista.
              </div>

              <label className="consent-row">
                <input type="checkbox" checked={consent} onChange={e => setConsent(e.target.checked)} />
                Autorizo o envio desta imagem para analise visual e confirmo que li o aviso informativo acima.
              </label>

              {error && <div className="error-msg">{error}</div>}

              <button className="btn-primary" onClick={analyze} disabled={!previewSrc}>
                &#10022; Analisar
              </button>
            </div>
          )}

          {phase === "report" && reportData && (
            <Report data={reportData} previewSrc={previewSrc} onReset={reset} />
          )}

          <div className="footer">&#10022; DermaScan AI · Uso estritamente informativo</div>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
