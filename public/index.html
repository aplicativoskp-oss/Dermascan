<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#0b0a09"/>
  <title>DermaScan AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#0b0a09;--sur:#121110;--sur2:#1a1814;--bor:#2a2420;--bor2:#353028;--gold:#c9a96e;--gold2:#e8d5a3;--gdim:rgba(201,169,110,.12);--gdim2:rgba(201,169,110,.22);--tx:#e8e0d5;--tx2:#a89880;--tx3:#6a6058;--red:#e8a0a0;--rdim:rgba(232,160,160,.12)}
    html,body{min-height:100%;background:var(--bg);color:var(--tx);font-family:'Josefin Sans',sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
    .app{min-height:100vh;max-width:540px;margin:0 auto;padding-bottom:60px}
    .header{text-align:center;padding:36px 20px 24px;border-bottom:1px solid var(--bor);position:relative}
    .header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:1px;background:var(--gold)}
    .logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;letter-spacing:10px;color:var(--gold);text-transform:uppercase}
    .logo-star{color:var(--gold2);margin-right:6px}
    .logo-sub{font-size:9px;letter-spacing:5px;color:var(--tx3);text-transform:uppercase;margin-top:6px}
    .upload-section{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:18px}
    .preview-frame{width:100%;max-width:360px;height:300px;border:1px solid var(--bor2);border-radius:4px;background:var(--sur);overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .3s;flex-shrink:0}
    .preview-frame.has-image{border-color:var(--gold)}
    .preview-frame::before,.preview-frame::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--gold);border-style:solid;pointer-events:none;opacity:0;transition:opacity .3s}
    .preview-frame.has-image::before{opacity:1;top:8px;left:8px;border-width:1px 0 0 1px}
    .preview-frame.has-image::after{opacity:1;bottom:8px;right:8px;border-width:0 1px 1px 0}
    .preview-img{width:100%;height:100%;object-fit:cover;display:block}
    .ph{display:flex;flex-direction:column;align-items:center;gap:10px}
    .ph-icon{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--bor2);line-height:1}
    .ph-label{font-size:10px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;text-align:center;line-height:1.8}
    .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:360px}
    .file-label{flex:1;min-width:130px;min-height:52px;display:flex;align-items:center;justify-content:center;background:var(--sur2);color:var(--gold);border:1px solid var(--bor2);border-radius:2px;padding:14px 16px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
    .file-label:active{border-color:var(--gold);background:var(--gdim)}
    .btn-sec{flex:1;min-width:130px;min-height:52px;background:var(--sur2);color:var(--gold);border:1px solid var(--bor2);border-radius:2px;padding:14px 16px;cursor:pointer;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .btn-sec:active{border-color:var(--gold);background:var(--gdim)}
    .btn-primary{width:100%;max-width:360px;min-height:52px;background:var(--gold);color:var(--bg);border:none;border-radius:2px;padding:16px;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:5px;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .btn-primary:active:not([disabled]){background:var(--gold2)}
    .btn-primary[disabled]{opacity:.4;cursor:not-allowed}
    .btn-reset{width:100%;background:transparent;color:var(--tx3);border:1px solid var(--bor);border-radius:2px;padding:16px;cursor:pointer;margin-top:16px;font-family:'Josefin Sans',sans-serif;font-size:9px;letter-spacing:4px;text-transform:uppercase;min-height:52px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .btn-reset:active{color:var(--gold);border-color:var(--gold)}
    .notice{max-width:360px;width:100%;font-size:11px;color:var(--tx3);line-height:1.8;background:var(--sur);border:1px solid var(--bor);border-radius:2px;padding:12px 16px}
    .notice strong{font-weight:400;color:var(--tx2)}
    .consent-row{max-width:360px;width:100%;display:flex;align-items:flex-start;gap:10px;font-size:11px;color:var(--tx2);line-height:1.7;cursor:pointer}
    .consent-row input{margin-top:3px;accent-color:var(--gold);flex-shrink:0;width:16px;height:16px}
    .err{color:var(--red);font-size:11px;text-align:center;padding:0 4px;max-width:360px;width:100%;display:none}
    .err.show{display:block}
    .loader{display:none;flex-direction:column;align-items:center;gap:14px;padding:60px 20px}
    .loader.show{display:flex}
    .ring{width:40px;height:40px;border:1px solid var(--bor2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-txt{font-size:9px;letter-spacing:5px;color:var(--tx3);text-transform:uppercase}
    .cam-ov{display:none;position:fixed;inset:0;background:#000;z-index:9999;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:20px}
    .cam-ov.show{display:flex}
    .cam-video{width:100%;max-width:480px;border-radius:4px;border:1px solid var(--bor2);background:#111;transform:scaleX(-1)}
    .cam-hint{font-size:10px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase}
    .cam-acts{display:flex;gap:16px;align-items:center}
    .cam-snap{width:64px;height:64px;border-radius:50%;border:none;background:var(--gold);color:var(--bg);font-size:22px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
    .cam-snap:active{transform:scale(.92)}
    .cam-snap[disabled]{opacity:.4}
    .cam-close{background:var(--sur);color:var(--tx2);border:1px solid var(--bor2);border-radius:2px;padding:12px 20px;cursor:pointer;min-height:48px;font-family:'Josefin Sans',sans-serif;font-size:10px;letter-spacing:3px;text-transform:uppercase;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
    .cam-err{color:var(--red);font-size:12px;text-align:center;max-width:340px;line-height:1.7;padding:16px}
    .report{display:none;padding:0 20px 20px;animation:fu .5s ease}
    .report.show{display:block}
    @keyframes fu{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .rh{display:flex;gap:14px;align-items:center;background:var(--sur);border:1px solid var(--bor2);border-radius:4px;padding:16px;margin-bottom:16px}
    .rthumb{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--gdim2);flex-shrink:0}
    .rtitle{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
    .tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
    .tag{padding:3px 10px;border-radius:2px;font-size:9px;letter-spacing:2px;text-transform:uppercase;background:var(--gdim);color:var(--gold);border:1px solid var(--gdim2)}
    .tag.d{background:var(--rdim);color:var(--red);border-color:rgba(232,160,160,.2)}
    .cb{display:flex;align-items:center;gap:8px;margin-top:8px}
    .ct{flex:1;height:2px;background:var(--bor2);border-radius:1px}
    .cf{height:2px;border-radius:1px}
    .cl{font-size:9px;letter-spacing:2px;text-transform:uppercase;min-width:40px;text-align:right}
    .card{background:var(--sur);border:1px solid var(--bor);border-radius:4px;padding:18px;margin-bottom:12px}
    .ctitle{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--bor)}
    .ctitle span{color:var(--tx3)}
    .sl{display:flex;flex-direction:column;gap:8px}
    .si{display:flex;gap:10px;align-items:flex-start}
    .sn{width:20px;height:20px;border-radius:50%;background:var(--gdim);color:var(--gold);font-size:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
    .st{font-size:12px;color:var(--tx2);line-height:1.6}
    .skg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .skl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--tx3);margin-bottom:8px}
    .ri{padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--bor)}
    .ri:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none}
    .rl{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
    .rv{font-size:12px;color:var(--tx2);line-height:1.6}
    .mp{font-family:'Cormorant Garamond',serif;font-size:15px;font-style:italic;font-weight:300;color:var(--tx2);line-height:1.8;background:var(--sur2);border:1px solid var(--bor2);border-radius:2px;padding:14px}
    .disc{font-size:10px;color:var(--tx3);line-height:1.8;margin-top:10px;padding-top:10px;border-top:1px solid var(--bor)}
    .footer{text-align:center;padding:20px;font-size:9px;letter-spacing:2px;color:var(--tx3);border-top:1px solid var(--bor)}
    @media(max-width:480px){.skg{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div class="cam-ov" id="camOv">
  <canvas id="camCvs" style="display:none"></canvas>
  <div id="camErrArea" style="display:none;flex-direction:column;align-items:center;gap:16px">
    <div class="cam-err" id="camErrMsg"></div>
    <button class="cam-close" onclick="closeCamera()">Fechar</button>
  </div>
  <div id="camStreamArea" style="display:flex;flex-direction:column;align-items:center;gap:16px;width:100%">
    <video id="camVid" class="cam-video" autoplay playsinline muted></video>
    <div class="cam-hint" id="camHint">Iniciando câmera…</div>
    <div class="cam-acts">
      <button class="cam-snap" id="camSnap" onclick="snapPhoto()" disabled>📷</button>
      <button class="cam-close" onclick="closeCamera()">Cancelar</button>
    </div>
  </div>
</div>

<div class="app">
  <div class="header">
    <div class="logo"><span class="logo-star">✦</span>DermaScan</div>
    <div class="logo-sub">Análise Cosmética Visual · AI</div>
  </div>

  <div class="loader" id="loader">
    <div class="ring"></div>
    <div class="loader-txt">Analisando</div>
  </div>

  <div class="upload-section" id="upSec">
    <div class="preview-frame" id="prevFrame">
      <div class="ph" id="prevPh">
        <div class="ph-icon">◎</div>
        <div class="ph-label">Foto frontal<br>boa iluminação</div>
      </div>
      <img id="prevImg" class="preview-img" src="" alt="" style="display:none"/>
    </div>

    <div class="btn-row">
      <label class="file-label" for="fileInp">↑ Galeria</label>
      <input id="fileInp" type="file" accept="image/*"
        style="clip:rect(0 0 0 0);clip-path:inset(50%);height:1px;overflow:hidden;position:absolute;width:1px;white-space:nowrap"
        onchange="onFile(event)"/>
      <button class="btn-sec" id="btnCam" onclick="openCamera()">◎ Câmera</button>
    </div>

    <div class="notice">
      Esta análise é <strong>estética e informativa</strong>.
      Não constitui diagnóstico médico nem substitui avaliação de dermatologista.
    </div>

    <label class="consent-row">
      <input type="checkbox" id="consent"/>
      Autorizo o envio desta imagem para análise visual e confirmo que li o aviso acima.
    </label>

    <div class="err" id="errMsg"></div>
    <button class="btn-primary" id="btnAn" onclick="analyze()" disabled>✦ Analisar</button>
  </div>

  <div class="report" id="report"></div>
  <div class="footer">✦ DermaScan AI · Uso estritamente informativo</div>
</div>

<script>
'use strict';
var curFile=null,prevUrl=null,camStr=null;
function g(id){return document.getElementById(id);}
function err(m){var e=g('errMsg');e.textContent=m;e.className='err'+(m?' show':'');}
function phase(p){g('upSec').style.display=p==='upload'?'flex':'none';g('loader').className='loader'+(p==='loading'?' show':'');g('report').className='report'+(p==='report'?' show':'');}

function onFile(e){var f=e.target.files&&e.target.files[0];if(f)handle(f);e.target.value='';}
function handle(f){
  if(!f)return;
  if(!f.type.startsWith('image/')){err('Selecione uma imagem válida.');return;}
  if(f.size>15*1024*1024){err('Imagem muito grande. Máximo: 15 MB.');return;}
  err('');curFile=f;
  var r=new FileReader();
  r.onload=function(e){if(e.target&&e.target.result){prevUrl=e.target.result;showPrev(prevUrl);}};
  r.onerror=function(){err('Não foi possível ler a imagem.');};
  r.readAsDataURL(f);
}
function showPrev(src){
  var i=g('prevImg');i.src=src;i.style.display='block';
  g('prevPh').style.display='none';
  g('prevFrame').classList.add('has-image');
  g('btnAn').disabled=false;
}

function openCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){err('Câmera indisponível. Use HTTPS.');return;}
  err('');
  g('camErrArea').style.display='none';g('camStreamArea').style.display='flex';
  g('camHint').style.display='block';g('camSnap').disabled=true;
  g('camOv').classList.add('show');
  var tryStr=navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:1280}},audio:false})
    .catch(function(){return navigator.mediaDevices.getUserMedia({video:true,audio:false});});
  tryStr.then(function(s){camStr=s;var v=g('camVid');v.srcObject=s;return v.play();})
    .then(function(){g('camHint').style.display='none';g('camSnap').disabled=false;})
    .catch(function(e){
      g('camStreamArea').style.display='none';g('camErrArea').style.display='flex';
      var m={NotAllowedError:'Permissão negada. Vá em Configurações e permita a câmera.',NotFoundError:'Nenhuma câmera encontrada.',NotReadableError:'Câmera em uso por outro app.'};
      g('camErrMsg').textContent=m[e.name]||'Câmera indisponível: '+e.name;
    });
}
function closeCamera(){if(camStr){camStr.getTracks().forEach(function(t){t.stop();});camStr=null;}var v=g('camVid');v.srcObject=null;g('camOv').classList.remove('show');}
function snapPhoto(){
  var v=g('camVid'),c=g('camCvs');
  c.width=v.videoWidth||640;c.height=v.videoHeight||640;
  c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  c.toBlob(function(b){closeCamera();handle(new File([b],'selfie.jpg',{type:'image/jpeg'}));;},'image/jpeg',.92);
}

function resize(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      URL.revokeObjectURL(url);
      var s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));
      var w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
      var c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){

  if(!b){
    rej(new Error('Falha ao converter imagem.'));
    return;
  }

  res(new File([b],'photo.jpg',{type:'image/jpeg'}));

},'image/jpeg',0.85);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Erro ao processar imagem.'));};
    img.src=url;
  });
}

function analyze(){
  if(!curFile){err('Adicione uma foto antes de analisar.');return;}
  if(!g('consent').checked){err('Confirme o consentimento para continuar.');return;}
  err('');phase('loading');
  resize(curFile).then(function(r){
    var fd=new FormData();fd.append('photo',r,'photo.jpg');
    return fetch('/.netlify/functions/analyze',{method:'POST',body:fd});
  }).then(function(r){
    return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Falha na análise.');return d;});
  }).then(function(d){renderReport(d);phase('report');g('report').scrollIntoView({behavior:'smooth'});})
  .catch(function(e){err(e.message||'Erro. Tente novamente.');phase('upload');});
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function steps(items){if(!items||!items.length)return'';return'<div class="sl">'+items.map(function(t,i){return'<div class="si"><div class="sn">'+(i+1)+'</div><div class="st">'+esc(t)+'</div></div>';}).join('')+'</div>';}
function tags(items,d){if(!items||!items.length)return'';return'<div class="tag-row">'+items.map(function(t){return'<span class="tag'+(d?' d':'')+'">'+esc(t)+'</span>';}).join('')+'</div>';}
function cbar(l){var p={baixa:30,media:65,alta:92}[l]||65,c={baixa:'#e8a87c',media:'#c9a96e',alta:'#8fc98f'}[l]||'#c9a96e',lb={baixa:'Baixa',media:'Média',alta:'Alta'}[l]||'Média';return'<div class="cb"><div class="ct"><div class="cf" style="width:'+p+'%;background:'+c+'"></div></div><span class="cl" style="color:'+c+'">'+lb+'</span></div>';}

function renderReport(r){
  var p=r.perfil||{},sk=r.skincare||{},vi=r.visagismo||{},co=r.colorimetria||{},mq=r.maquiagem||{};
  var tgs=[p.tipoPeleEstimado,p.formatoRostoEstimado,p.subtomEstimado].filter(Boolean).map(function(t){return'<span class="tag">'+esc(t)+'</span>';}).join('');
  var sob=vi.sobrancelha?'<div class="ri"><span class="rl">Sobrancelha</span><div class="rv"><strong style="color:var(--gold);font-weight:400">'+esc(vi.sobrancelha.estilo)+'</strong>'+(vi.sobrancelha.dica?' — '+esc(vi.sobrancelha.dica):'')+'</div></div>':'';
  var mk=[];if(mq.batom&&mq.batom.length)mk.push('Batons: '+mq.batom.map(esc).join(', ')+'.');if(mq.sombra&&mq.sombra.length)mk.push('Sombra: '+mq.sombra.map(esc).join(' ou ')+'.');if(mq.blush)mk.push('Blush: '+esc(mq.blush)+'.');
  g('report').innerHTML=
    '<div class="rh">'+(prevUrl?'<img src="'+prevUrl+'" class="rthumb" alt=""/>':'')+
    '<div style="flex:1"><div class="rtitle">Análise Visual</div><div class="tag-row">'+tgs+'</div>'+(p.confiancaGeral?cbar(p.confiancaGeral):'')+'</div></div>'+
    ((r.observacoes&&r.observacoes.length)?'<div class="card"><div class="ctitle">Observações <span>visuais</span></div>'+steps(r.observacoes)+'</div>':'')+
    '<div class="card"><div class="ctitle">Skincare <span>protocolo</span></div><div class="skg"><div><div class="skl">Manhã</div>'+steps(sk.manha)+'</div><div><div class="skl">Noite</div>'+steps(sk.noite)+'</div></div></div>'+
    '<div class="card"><div class="ctitle">Visagismo <span>facial</span></div><div class="ri"><span class="rl">Cortes sugeridos</span><div class="rv">'+esc((vi.cortes||[]).join(', '))+'</div></div><div class="ri"><span class="rl">Coloração</span><div class="rv">'+esc((vi.coloracao||[]).join(', '))+'</div></div>'+sob+'</div>'+
    '<div class="card"><div class="ctitle">Colorimetria <span>paleta</span></div><div class="ri"><span class="rl">Cartela provável</span><div class="rv">'+esc(co.cartelaProvavel)+'</div></div><div class="ri"><span class="rl">Cores de poder</span>'+tags(co.coresPoder)+'</div><div><span class="rl">Evitar</span>'+tags(co.coresEvitar,true)+'</div></div>'+
    '<div class="card"><div class="ctitle">Maquiagem <span>sugestões</span></div><div class="mp">'+mk.join(' ')+'</div></div>'+
    ((r.limitacoes&&r.limitacoes.length)?'<div class="card"><div class="ctitle">Limitações <span>da leitura</span></div>'+steps(r.limitacoes)+(r.disclaimer?'<p class="disc">'+esc(r.disclaimer)+'</p>':'')+'</div>':'')+
    '<button class="btn-reset" onclick="reset()">↺ Nova análise</button>';
}

function reset(){
  curFile=null;prevUrl=null;
  var i=g('prevImg');i.src='';i.style.display='none';
  g('prevPh').style.display='flex';g('prevFrame').classList.remove('has-image');
  g('consent').checked=false;g('btnAn').disabled=true;g('fileInp').value='';g('report').innerHTML='';
  err('');phase('upload');window.scrollTo({top:0,behavior:'smooth'});
}

(function(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    g('btnCam').style.display='none';
  }

  phase('upload');
})();
</script>
</body>
</html>
